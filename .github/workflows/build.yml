name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report build errors
        if: failure() && matrix.config.target == 'Android64'
        shell: bash
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          ls /usr/local/lib/android/sdk/ndk/ | sed 's/^/::warning::ndk /'
          echo "::warning::GEODE_SDK=$GEODE_SDK cli=$(geode --version 2>&1)"
          rm -rf dbg
          { cmake -B dbg -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DGEODE_DONT_INSTALL_MODS=ON \
              -DGEODE_TARGET_PLATFORM=Android64 && cmake --build dbg; } > dbg.log 2>&1 || true
          grep -iE "error|fail" dbg.log | head -25 | sed 's/^/::error::/'
          tail -15 dbg.log | sed 's/^/::warning::/'

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
